[package]
name = "trunkline-p2p-probe"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
either = "1"
futures = "0.3"
libp2p = { version = "0.57.1", features = ["tokio", "tcp", "quic", "dns", "noise", "yamux", "relay", "dcutr", "identify", "ping", "kad", "macros", "rsa"] }
libp2p-stream = "0.5.0-alpha"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal", "net", "io-util"] }
tokio-util = { version = "0.7.20", features = ["compat"] }

[profile.release]
lto = "thin"

