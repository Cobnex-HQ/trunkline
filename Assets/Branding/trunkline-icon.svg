<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254" role="img" aria-labelledby="title desc">
  <title id="title">Trunkline — Glacier Fold</title>
  <desc id="desc">The Glacier Fold elephant in ivory paper and glacier blue on a midnight-blue app tile.</desc>
  <defs>
    <linearGradient id="midnight" x1="0" y1="0" x2=".8" y2="1">
      <stop stop-color="#163b80"/><stop offset=".4" stop-color="#062361"/><stop offset="1" stop-color="#001347"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2=".5" y2="1">
      <stop stop-color="#5679af" stop-opacity=".38"/><stop offset=".5" stop-color="#163b80" stop-opacity=".1"/><stop offset="1" stop-color="#000a26" stop-opacity=".5"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2=".7" y2="1">
      <stop stop-color="#fffaf0"/><stop offset="1" stop-color="#e6e0d2"/>
    </linearGradient>
    <linearGradient id="ear-paper" x1="0" y1="0" x2="1" y2=".8">
      <stop stop-color="#fffaf0"/><stop offset="1" stop-color="#ece5d8"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2=".5" y2="1">
      <stop stop-color="#8eafc4"/><stop offset="1" stop-color="#c6e0ed"/>
    </linearGradient>
    <filter id="paper-shadow" x="-.15" y="-.15" width="1.3" height="1.4" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000b25" flood-opacity=".55"/>
    </filter>
    <filter id="fold-shadow" x="-.2" y="-.2" width="1.4" height="1.4" color-interpolation-filters="sRGB">
      <feDropShadow dx="6" dy="9" stdDeviation="6" flood-color="#322b20" flood-opacity=".38"/>
    </filter>
  </defs>
  <g id="app-tile">
    <rect x="89" y="103" width="1072" height="1072" rx="258" fill="url(#midnight)"/>
    <rect x="91" y="105" width="1068" height="1068" rx="256" fill="none" stroke="url(#rim)" stroke-width="4"/>
  </g>
  <g id="elephant" filter="url(#paper-shadow)">
    <path id="rear-leg" fill="url(#paper)" d="M412 619 278 709 196 985 375 985 425 846 587 731Z"/>
    <path id="glacier-leg" fill="url(#ice)" d="M587 731 506 985 749 985 699 822 758 650Z"/>
    <path id="head-and-trunk" fill="url(#paper)" d="M587 731 714 388 798 389 881 469 928 451 942 296 1052 240 998 342 1023 486 902 622 758 650Z"/>
    <path id="folded-ear" fill="url(#ear-paper)" filter="url(#fold-shadow)" d="M273 523 466 319 714 388 587 731Z"/>
    <path id="fold-highlight" fill="none" stroke="#fffaf0" stroke-opacity=".65" stroke-width="2" d="M273 523 466 319 714 388 587 731"/>
  </g>
</svg>
