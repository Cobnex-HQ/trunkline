name: Mac development build
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
jobs:
  host:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and verify bundled Mac app
        run: ./Scripts/setup-mac.sh build
      - name: Native Mac client tests
        run: >-
          xcodebuild -quiet -project Trunkline.xcodeproj -scheme MacClientTests
          -destination 'platform=macOS' -derivedDataPath .build/dev-mac
          CODE_SIGNING_ALLOWED=NO test
